name: Build and Test 🏗
run-name: ${{ github.actor }} pushed and opened a Pull Request {{ github.commit }} 💻
on:
  pull_request:
    types: [review_requested, opened, reopened, synchronize]
permissions:
  contents: write
jobs:
  setup-flutter:
    runs-on: macos-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          persist-credentials: false
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - name: Setup fvm 🚀
        run: curl -fsSL https://fvm.app/install.sh | bash -s -- 3.2.1
      - name: Setup fvm version 📌
        run: fvm install 3.29.2 --skip-pub-get && fvm use 3.29.2 --skip-pub-get
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: Flutter pub get!
        run: fvm flutter pub get
      - name: Installing lcov
        run: brew install lcov
      - name: Testing ${{ github.actor }} code and checking test coverage 🚀
        run: fvm flutter test --coverage && lcov --remove coverage/lcov.info -o coverage/lcov.info && sh coverage_check.sh
      - name: Settings github actions bot configs
        uses: raven-actions/bot-details@v1
        id: bot-details
        with:
          bot_slug_name: code-coverage-badge-bot
      - run: |
          git config --global user.name "${{ steps.bot-details.outputs.name }}"
          git config --global user.email "${{ steps.bot-details.outputs.email }}"
      - name: Generating test code coverage badge 🏅
        run: fvm dart run test_coverage_badge --file coverage/lcov.info
      - name: Uploading test code coverage badge to PR
        run: git add coverage_badge.svg && git commit -m "Add test coverage badge" && git push
      - name: Run linter 👀
        run: |
          fvm dart analyze --fatal-warnings --fatal-infos
      - name: Run formatter🔎
        run: |
          fvm dart format lib/ --set-exit-if-changed
      - run: echo "🍏 This job's status is ${{ job.status }}."